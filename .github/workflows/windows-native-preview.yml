name: Windows Native Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/windows-native-preview.yml"
  push:
    branches:
      - "codex/gpui-native-v4"
    paths:
      - "native/**"
      - ".github/workflows/windows-native-preview.yml"

permissions:
  contents: read

concurrency:
  group: windows-native-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust and GPUI technical gate (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 60

    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.90.0
          rustc --version --verbose
          cargo --version

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Read native workspace version
        id: native-version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "dcmget-desktop" }).version
          if (-not $version) { throw "Could not resolve the dcmget-desktop package version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Test native core
        run: cargo test --locked --workspace --exclude dcmget-desktop --exclude dcmget-ui-kit

      - name: Test UI adapter without a window system
        run: cargo test --locked -p dcmget-ui-kit

      - name: Lint native core
        run: cargo clippy --locked --workspace --exclude dcmget-desktop --exclude dcmget-ui-kit --all-targets -- -D warnings

      - name: Build real GPUI desktop and native tools
        run: |
          cargo build --locked --release -p dcmget-desktop --no-default-features --features gpui-ui --target x86_64-pc-windows-msvc
          cargo build --locked --release -p dcmget-cli --target x86_64-pc-windows-msvc

      - name: Verify AMD64 PE files and preview contents
        shell: pwsh
        run: |
          $target = Join-Path $PWD "target/x86_64-pc-windows-msvc/release"
          $output = Join-Path $PWD "dist/DcmGet-${{ steps.native-version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Force $output | Out-Null

          function Assert-Amd64Pe([string]$path) {
            $stream = [IO.File]::OpenRead($path)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "$path is not a PE file" }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "$path has no PE signature" }
              if ($reader.ReadUInt16() -ne 0x8664) { throw "$path is not AMD64" }
            } finally {
              $stream.Dispose()
            }
          }

          foreach ($name in @("dcmget-desktop.exe", "dcmget-cli.exe")) {
            $source = Join-Path $target $name
            if (-not (Test-Path $source -PathType Leaf)) { throw "Missing native binary: $name" }
            Assert-Amd64Pe $source
            Copy-Item $source $output
          }

          $forbidden = @(Get-ChildItem $output -Recurse -File | Where-Object {
            $_.Name -match '(?i)python|dcmtk|movescu|storescp|tauri' -or
            $_.Extension -in @('.py', '.pyc')
          })
          if ($forbidden.Count -ne 0) {
            throw "Forbidden legacy runtime content: $($forbidden.FullName -join ', ')"
          }

          Get-ChildItem $output -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content (Join-Path $output "SHA256SUMS.txt") -Encoding ascii

      - name: Upload technical preview
        uses: actions/upload-artifact@v4
        with:
          name: DcmGet-${{ steps.native-version.outputs.version }}-windows-x64
          path: native/dist/DcmGet-${{ steps.native-version.outputs.version }}-windows-x64
          if-no-files-found: error
          retention-days: 14
