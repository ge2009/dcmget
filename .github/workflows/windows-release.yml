name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in X.Y.Z format
        required: true
        default: 3.7.5
      publish_release:
        description: Publish the verified build to GitHub Releases
        required: true
        type: boolean
        default: false
      component_update:
        description: Build a component patch from the previous stable GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 EXE and installer
    runs-on: windows-2025
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Require update signing key for publication
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.DCMGET_UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY)) {
            throw "DCMGET_UPDATE_SIGNING_PRIVATE_KEY_BASE64 is required"
          }

      - name: Validate update publication inputs
        if: ${{ inputs.component_update && !inputs.publish_release }}
        shell: pwsh
        run: throw "component_update requires publish_release"

      - name: Check out 2.9.1 upgrade baseline
        uses: actions/checkout@v4
        with:
          ref: dc5547ee4bb7884867ecc97d64e1c11d63bed5d3
          path: upgrade-baseline

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify and build React workspace
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Verify AMD64 Python build host
        shell: pwsh
        run: python -c "from dcmget.architecture import ensure_supported_runtime; ensure_supported_runtime(); print('AMD64 Python runtime verified')"

      - name: Configure optional Authenticode certificate
        shell: pwsh
        env:
          DCMGET_SIGN_CERTIFICATE_BASE64: ${{ secrets.DCMGET_SIGN_CERTIFICATE_BASE64 }}
          DCMGET_SIGN_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.DCMGET_SIGN_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DCMGET_SIGN_CERTIFICATE_BASE64)) {
            Write-Host "No signing certificate configured; release manifest will state UNSIGNED."
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "dcmget-authenticode.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:DCMGET_SIGN_CERTIFICATE_BASE64)
          )
          "DCMGET_SIGN_CERTIFICATE_PATH=$certificatePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DCMGET_SIGN_CERTIFICATE_PASSWORD=$env:DCMGET_SIGN_CERTIFICATE_PASSWORD_SECRET" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DCMGET_SIGN_TIMESTAMP_URL=http://timestamp.digicert.com" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Download and verify offline x64 WebView2 Runtime
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2124701" -OutFile $target
          if (-not (Test-Path $target -PathType Leaf)) { throw "WebView2 Runtime installer was not downloaded" }
          if ((Get-Item $target).Length -lt 50MB) { throw "WebView2 Runtime installer is unexpectedly small" }
          $signature = Get-AuthenticodeSignature $target
          if ($signature.Status -ne "Valid") {
            throw "WebView2 Runtime Authenticode signature is $($signature.Status): $($signature.StatusMessage)"
          }
          if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch "CN=Microsoft Corporation(?:,|$)") {
            throw "WebView2 Runtime signer is not Microsoft Corporation"
          }
          Write-Host "Verified WebView2 Runtime $((Get-Item $target).VersionInfo.FileVersion) signed by $($signature.SignerCertificate.Subject)"
          "DCMGET_WEBVIEW2_RUNTIME_PATH=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore DCMTK cache
        # Keep the retired path in the cache key only so existing verified
        # DCMTK caches remain reusable while OFFIS blocks hosted runners.
        # WinSW is neither verified, packaged nor executed by this build.
        uses: actions/cache@v4
        with:
          path: |
            .runtime/dcmtk/windows-x86_64
            .runtime/downloads
            .runtime/winsw/v2.12.0
          key: dcmtk-3.7.0-integrity-v2-windows-x86_64

      - name: Prepare DCMTK
        shell: pwsh
        run: |
          python scripts/download_dcmtk.py --platform windows-x86_64

      - name: Restore OHIF Viewer cache
        uses: actions/cache@v4
        with:
          path: .runtime/ohif
          key: ohif-3.12.6-${{ hashFiles('packaging/ohif/**', 'scripts/prepare_ohif.py') }}

      - name: Prepare OHIF Viewer offline assets
        shell: pwsh
        run: python scripts/prepare_ohif.py

      - name: Build standalone and portable EXE
        run: python scripts/build_windows.py --version "${{ inputs.version }}"

      - name: Verify AMD64 application and DCMTK payloads
        run: python scripts/build_windows.py --version "${{ inputs.version }}" --verify-architecture-only

      - name: Verify minimal DCMTK runtime and tools
        shell: pwsh
        run: |
          function Assert-MinimalDcmtk([string]$runtimeRoot, [bool]$startTools) {
            $bin = (Resolve-Path (Join-Path $runtimeRoot "dcmtk-3.7.0-win64-dynamic/bin")).Path
            $expected = @(
              "movescu.exe", "storescp.exe", "dcmmkdir.exe", "dcmdump.exe",
              "dcmdata.dll", "dcmimage.dll", "dcmimgle.dll", "dcmjpeg.dll",
              "dcmnet.dll", "dcmtls.dll", "ijg8.dll", "ijg12.dll", "ijg16.dll",
              "oficonv.dll", "oflog.dll", "ofstd.dll"
            ) | Sort-Object
            $actual = @(Get-ChildItem $bin -File | ForEach-Object Name | Sort-Object)
            $difference = @(Compare-Object $expected $actual)
            if ($difference.Count -ne 0) {
              throw "Packaged DCMTK bin allowlist mismatch: $($difference | Out-String)"
            }
            if (Test-Path (Join-Path $bin "dcmj2pnm.exe") -PathType Leaf) { throw "Unused dcmj2pnm.exe was packaged" }
            if (Test-Path (Join-Path $bin "dcmdjpeg.exe") -PathType Leaf) { throw "Unused dcmdjpeg.exe was packaged" }
            if ($startTools) {
              foreach ($tool in @("movescu.exe", "storescp.exe", "dcmmkdir.exe", "dcmdump.exe")) {
                & (Join-Path $bin $tool) --version | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "$tool failed to start from the minimal runtime" }
              }
            }
          }

          $onedirRuntime = "build/windows/dist/DcmGet/_internal/.runtime/dcmtk/windows-x86_64"
          Assert-MinimalDcmtk $onedirRuntime $true
          $expanded = Join-Path $env:RUNNER_TEMP "dcmget-minimal-runtime-zip"
          Remove-Item $expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "release/windows/DcmGet-${{ inputs.version }}-windows-x64.zip" $expanded
          Assert-MinimalDcmtk (Join-Path $expanded "DcmGet/_internal/.runtime/dcmtk/windows-x86_64") $true
          Remove-Item $expanded -Recurse -Force

      - name: Verify real profile desktop shortcut
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "DcmGet Shortcut Test"
          New-Item -ItemType Directory -Force $fixture | Out-Null
          $env:DCMGET_TEST_EXE = Join-Path $fixture "DcmGet.exe"
          $env:DCMGET_TEST_DESKTOP = Join-Path $fixture "Desktop"
          Copy-Item "build/windows/dist/DcmGet/DcmGet.exe" $env:DCMGET_TEST_EXE -Force
          python -c "import os; from dcmget.instance_shortcut import create_instance_shortcut, default_instance_shortcut_name; create_instance_shortcut(6, default_instance_shortcut_name(6666, 'DCMGET'), os.environ['DCMGET_TEST_DESKTOP'], web_port=8787, executable=os.environ['DCMGET_TEST_EXE'], frozen=True, platform='win32')"
          if ($LASTEXITCODE -ne 0) { throw "Could not create profile shortcut" }
          $link = Join-Path $env:DCMGET_TEST_DESKTOP "dcmget-6666-DCMGET.url"
          if (-not (Test-Path $link -PathType Leaf)) { throw "Profile URL shortcut was not created" }
          $content = Get-Content $link -Raw
          if ($content -notmatch '(?m)^URL=http://127\.0\.0\.1:8787/$') { throw "Profile URL shortcut target is incorrect: $content" }

      - name: Verify embedded React, WebView, OHIF and PDI resources
        shell: pwsh
        run: |
          function Assert-WebResources([string]$resourceRoot) {
            if (-not (Test-Path (Join-Path $resourceRoot "webview") -PathType Container)) {
              throw "Missing embedded pywebview modules"
            }
            $webui = Join-Path $resourceRoot "dcmget\webui-react"
            @("index.html", "app.css", "app.js", "theme.js") | ForEach-Object {
              $asset = Join-Path $webui $_
              if (-not (Test-Path $asset -PathType Leaf)) {
                throw "Missing offline DcmGet React Web resource: $asset"
              }
              if ((Get-Item $asset).Length -eq 0) {
                throw "Offline DcmGet React Web resource is empty: $asset"
              }
            }
          }

          function Assert-PdiResources([string]$resourceRoot) {
            $server = Join-Path $resourceRoot "DcmGetPdiServer.exe"
            $serverScript = Join-Path $resourceRoot "dcmget\pdi_server.py"
            $architectureScript = Join-Path $resourceRoot "dcmget\architecture.py"
            $ohif = Join-Path $resourceRoot ".runtime\ohif\ohif-3.12.6"
            if (-not (Test-Path $server -PathType Leaf)) { throw "Missing PDI server at $server" }
            if (-not (Test-Path $serverScript -PathType Leaf)) { throw "Missing portable PDI server script at $serverScript" }
            if (-not (Test-Path $architectureScript -PathType Leaf)) { throw "Missing PDI architecture guard at $architectureScript" }
            @(
              "index.html", "app-config.js", "init-service-worker.js",
              "LICENSE-OHIF.txt", "THIRD_PARTY-OHIF.md",
              "DCMGET_OHIF_PAYLOAD.json", "DCMGET_PAYLOAD.SHA256"
            ) | ForEach-Object {
              if (-not (Test-Path (Join-Path $ohif $_) -PathType Leaf)) {
                throw "Missing OHIF resource: $_"
              }
            }
            if (Test-Path (Join-Path $ohif "sw.js")) { throw "Online service worker was packaged" }
          }

          $unpackedResourceRoot = (Resolve-Path "build/windows/dist/DcmGet/_internal").Path
          Assert-WebResources $unpackedResourceRoot
          Assert-PdiResources $unpackedResourceRoot
          if (Test-Path (Join-Path $unpackedResourceRoot "DCMGET_PORTABLE_RUNTIME.json")) {
            throw "Unpacked application must not publish DCMTK to the portable user runtime"
          }
          $expanded = Join-Path $env:RUNNER_TEMP "dcmget-standalone-expanded"
          Expand-Archive "release/windows/DcmGet-${{ inputs.version }}-windows-x64.zip" $expanded
          $zipResourceRoot = (Resolve-Path "$expanded/DcmGet/_internal").Path
          Assert-WebResources $zipResourceRoot
          Assert-PdiResources $zipResourceRoot
          if (Test-Path (Join-Path $zipResourceRoot "DCMGET_PORTABLE_RUNTIME.json")) {
            throw "ZIP application must not publish DCMTK to the portable user runtime"
          }

          $archiveListing = "build/windows/portable-archive.txt"
          pyi-archive_viewer -r "release/windows/DcmGet-${{ inputs.version }}-windows-x64-portable.exe" *> $archiveListing
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect portable EXE archive" }
          if (-not (Select-String -Path $archiveListing -Pattern "DcmGetPdiServer\.exe" -Quiet)) { throw "Portable EXE is missing PDI server" }
          if (-not (Select-String -Path $archiveListing -Pattern "dcmget.*pdi_server\.py" -Quiet)) { throw "Portable EXE is missing portable PDI server script" }
          if (-not (Select-String -Path $archiveListing -Pattern "dcmget.*architecture\.py" -Quiet)) { throw "Portable EXE is missing PDI architecture guard" }
          if (-not (Select-String -Path $archiveListing -Pattern "dcmget.*instance_shortcut" -Quiet)) { throw "Portable EXE is missing profile shortcut support" }
          if (-not (Select-String -Path $archiveListing -Pattern "dcmget.*webui-react.*index\.html" -Quiet)) { throw "Portable EXE is missing DcmGet React Web index" }
          if (-not (Select-String -Path $archiveListing -Pattern "dcmget.*webui-react.*app\.css" -Quiet)) { throw "Portable EXE is missing DcmGet React Web styles" }
          if (-not (Select-String -Path $archiveListing -Pattern "dcmget.*webui-react.*app\.js" -Quiet)) { throw "Portable EXE is missing DcmGet React Web application" }
          if (-not (Select-String -Path $archiveListing -Pattern "dcmget.*webui-react.*theme\.js" -Quiet)) { throw "Portable EXE is missing DcmGet React Web theme bootstrap" }
          if (-not (Select-String -Path $archiveListing -Pattern "fastapi" -Quiet)) { throw "Portable EXE is missing FastAPI" }
          if (Select-String -Path $archiveListing -Pattern "nicegui" -Quiet) { throw "Portable EXE still contains removed NiceGUI runtime" }
          if (-not (Select-String -Path $archiveListing -Pattern "webview" -Quiet)) { throw "Portable EXE is missing pywebview" }
          if (-not (Select-String -Path $archiveListing -Pattern "uvicorn" -Quiet)) { throw "Portable EXE is missing Uvicorn" }
          if (-not (Select-String -Path $archiveListing -Pattern "ohif-3\.12\.6.*index\.html" -Quiet)) { throw "Portable EXE is missing OHIF index" }
          if (-not (Select-String -Path $archiveListing -Pattern "pynetdicom" -Quiet)) { throw "Portable EXE is missing pynetdicom compatibility modules" }
          if (-not (Select-String -Path $archiveListing -Pattern "DCMGET_PORTABLE_RUNTIME\.json" -Quiet)) { throw "Portable EXE is missing the stable DCMTK runtime manifest" }

      - name: Smoke test standalone PDI server
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "dcmget-pdi-server-fixture"
          New-Item -ItemType Directory -Force "$fixture/VIEWER/OHIF", "$fixture/VIEWER/.dcmget", "$fixture/DICOM" | Out-Null
          Set-Content "$fixture/VIEWER/OHIF/index.html" "OHIF SERVER SMOKE" -Encoding utf8NoBOM
          $viewerDigest = (Get-FileHash "$fixture/VIEWER/OHIF/index.html" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$fixture/VIEWER/OHIF/DCMGET_PAYLOAD.SHA256",
            "$viewerDigest  index.html`n",
            [Text.UTF8Encoding]::new($false)
          )
          Set-Content "$fixture/VIEWER/.dcmget/index" '{"studies":[{"series":[{"instances":[{"metadata":{},"url":"dicomweb:/DICOM/I000001"}]}]}]}' -Encoding utf8NoBOM
          [IO.File]::WriteAllBytes("$fixture/DICOM/I000001", [byte[]](0..9))

          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $server = (Resolve-Path "build/windows/dist/DcmGetPdiServer.exe").Path
          $token = (python -c "import secrets; print(secrets.token_urlsafe(32))").Trim()
          # Do not pass --quiet here: the exported OPEN_VIEWER.exe is a
          # windowed process without stderr, which is the real double-click path.
          # Bind the token with '=' so a valid token that begins with '-' is
          # never misread by argparse as another option.
          $process = Start-Process $server -ArgumentList @("--root", "`"$fixture`"", "--port", "$port", "--session-token=$token", "--no-browser") -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($process.HasExited) {
                $viewerLog = Join-Path $env:LOCALAPPDATA "DcmGet\logs\dcmget-pdi-viewer.log"
                if (Test-Path $viewerLog -PathType Leaf) { Get-Content $viewerLog | Write-Host }
                throw "PDI server exited with code $($process.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest -Method Head "http://127.0.0.1:$port/ready/$token"
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw "PDI server did not become ready" }
            $session = [Microsoft.PowerShell.Commands.WebRequestSession]::new()
            $viewer = Invoke-WebRequest "http://127.0.0.1:$port/open/$token" -WebSession $session
            if ($viewer.StatusCode -ne 200 -or $viewer.Content -notmatch "OHIF SERVER SMOKE") { throw "PDI directory viewer request failed" }
            $manifest = Invoke-WebRequest "http://127.0.0.1:$port/api/studies" -WebSession $session
            if ($manifest.StatusCode -ne 200 -or $manifest.Content -notmatch '"studies"') { throw "PDI manifest request failed" }
            $range = Invoke-WebRequest "http://127.0.0.1:$port/DICOM/I000001" -WebSession $session -Headers @{ Range = "bytes=2-5" }
            if ($range.StatusCode -ne 206 -or $range.Headers["Content-Range"] -notmatch "bytes 2-5/10") { throw "PDI byte-range request failed" }
          } finally {
            if (-not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }

      - name: Download VC++ Runtime for installer
        shell: pwsh
        run: |
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile build/windows/vc_redist.x64.exe
          $signature = Get-AuthenticodeSignature build/windows/vc_redist.x64.exe
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "VC++ Runtime Authenticode validation failed: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }

      - name: Smoke test unpacked application
        shell: pwsh
        run: |
          $exe = "build/windows/dist/DcmGet/DcmGet.exe"
          $process = Start-Process $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Unpacked self-test failed with code $($process.ExitCode)" }
          $config = Join-Path $env:RUNNER_TEMP "dcmget-unpacked-web-self-test.json"
          $web = Start-Process $exe -ArgumentList @("--web-self-test", "--config", $config) -Wait -PassThru
          if ($web.ExitCode -ne 0) {
            $diagnostic = Get-ChildItem (Join-Path $env:LOCALAPPDATA "DcmGet\logs") -Filter "dcmget-diagnostics-*.log" -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1
            if ($diagnostic) { Get-Content $diagnostic.FullName -Raw }
            throw "Unpacked Web self-test failed with code $($web.ExitCode)"
          }

      - name: Smoke test portable application
        shell: pwsh
        run: |
          $portable = (Resolve-Path "release/windows/DcmGet-${{ inputs.version }}-windows-x64-portable.exe").Path
          $runtimeRoot = Join-Path $env:LOCALAPPDATA "DcmGet\runtime\dcmtk"
          if (Test-Path $runtimeRoot) { Remove-Item $runtimeRoot -Recurse -Force }
          $reportA = Join-Path $env:RUNNER_TEMP "dcmget-portable-self-test-a.json"
          $reportB = Join-Path $env:RUNNER_TEMP "dcmget-portable-self-test-b.json"
          Remove-Item $reportA, $reportB -Force -ErrorAction SilentlyContinue

          $first = Start-Process $portable -ArgumentList @("--self-test", "--self-test-report", "`"$reportA`"") -PassThru
          $second = Start-Process $portable -ArgumentList @("--self-test", "--self-test-report", "`"$reportB`"") -PassThru
          $first.WaitForExit()
          $second.WaitForExit()
          if ($first.ExitCode -ne 0) { throw "First portable self-test failed with code $($first.ExitCode)" }
          if ($second.ExitCode -ne 0) { throw "Second portable self-test failed with code $($second.ExitCode)" }
          if (-not (Test-Path $reportA -PathType Leaf) -or -not (Test-Path $reportB -PathType Leaf)) {
            throw "Portable self-test did not write both runtime reports"
          }

          $firstReport = Get-Content $reportA -Raw | ConvertFrom-Json
          $secondReport = Get-Content $reportB -Raw | ConvertFrom-Json
          if (-not [String]::Equals($firstReport.storescp, $secondReport.storescp, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Simultaneous portable launches resolved different storescp paths"
          }
          if (-not [String]::Equals($firstReport.portable_dcmtk_bin, $secondReport.portable_dcmtk_bin, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Simultaneous portable launches published different DCMTK directories"
          }
          $stableRoot = [IO.Path]::GetFullPath((Resolve-Path $runtimeRoot).Path)
          $storescp = [IO.Path]::GetFullPath([string]$firstReport.storescp)
          $portableBin = [IO.Path]::GetFullPath([string]$firstReport.portable_dcmtk_bin)
          if (-not $storescp.StartsWith($stableRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Portable storescp is outside the per-user stable runtime: $storescp"
          }
          if ($storescp -match '(?i)[\\/]_MEI[^\\/]*[\\/]') {
            throw "Portable storescp still runs from PyInstaller temporary extraction: $storescp"
          }
          if (-not [String]::Equals((Split-Path $storescp -Parent), $portableBin, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Portable storescp does not come from the reported stable bin directory"
          }
          if (-not (Test-Path $storescp -PathType Leaf)) { throw "Stable portable storescp does not exist" }
          $expectedDcmtkBin = @(
            "movescu.exe", "storescp.exe", "dcmmkdir.exe", "dcmdump.exe",
            "dcmdata.dll", "dcmimage.dll", "dcmimgle.dll", "dcmjpeg.dll",
            "dcmnet.dll", "dcmtls.dll", "ijg8.dll", "ijg12.dll", "ijg16.dll",
            "oficonv.dll", "oflog.dll", "ofstd.dll"
          ) | Sort-Object
          $portableDcmtkBin = @(Get-ChildItem $portableBin -File | ForEach-Object Name | Sort-Object)
          $portableDifference = @(Compare-Object $expectedDcmtkBin $portableDcmtkBin)
          if ($portableDifference.Count -ne 0) {
            throw "Portable DCMTK bin allowlist mismatch: $($portableDifference | Out-String)"
          }
          $published = @(Get-ChildItem $runtimeRoot -Directory | Where-Object { $_.Name -notlike ".*" })
          if ($published.Count -ne 1) { throw "Expected one atomically published portable runtime, found $($published.Count)" }
          if (@(Get-ChildItem $runtimeRoot -Directory -Force | Where-Object { $_.Name -like ".*.tmp-*" }).Count -ne 0) {
            throw "Portable runtime left a temporary publish directory"
          }

          $config = Join-Path $env:RUNNER_TEMP "dcmget-portable-web-self-test.json"
          $web = Start-Process $portable -ArgumentList @("--web-self-test", "--config", $config) -Wait -PassThru
          if ($web.ExitCode -ne 0) {
            $diagnostic = Get-ChildItem (Join-Path $env:LOCALAPPDATA "DcmGet\logs") -Filter "dcmget-diagnostics-*.log" -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1
            if ($diagnostic) { Get-Content $diagnostic.FullName -Raw }
            throw "Portable Web self-test failed with code $($web.ExitCode)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not installed" }

      - name: Prepare Chinese installer language
        shell: pwsh
        run: |
          $language = "build/windows/ChineseSimplified.isl"
          Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/929fc4e164798bd84fec385a1dc8a899a0d4a100/Files/Languages/ChineseSimplified.isl" -OutFile $language
          $expected = "6753be2c5e2740d859900fd902824db2ec568da5c5b52486524c9762d778b0b0"
          $actual = (Get-FileHash $language -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Chinese language file checksum mismatch: $actual" }

      - name: Build pinned 2.9.1 upgrade baseline installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $baselineRoot = (Resolve-Path "upgrade-baseline").Path
          $baselineRuntime = Join-Path $baselineRoot ".runtime"
          New-Item -ItemType Directory -Force $baselineRuntime | Out-Null
          Copy-Item -LiteralPath ".runtime\downloads" -Destination $baselineRuntime -Recurse -Force
          $baselineOhif = Join-Path $baselineRuntime "ohif"
          New-Item -ItemType Directory -Force $baselineOhif | Out-Null
          Copy-Item -LiteralPath ".runtime\ohif\cache" -Destination (Join-Path $baselineOhif "cache") -Recurse -Force
          $baselinePython = Join-Path $baselineRoot ".venv\Scripts\python.exe"
          python -m venv (Join-Path $baselineRoot ".venv")
          & $baselinePython -m pip install --upgrade pip
          & $baselinePython -m pip install -r (Join-Path $baselineRoot "requirements-build.txt")
          Push-Location $baselineRoot
          try {
            & $baselinePython scripts/download_dcmtk.py --platform windows-x86_64
            if ($LASTEXITCODE -ne 0) { throw "Pinned 2.9.1 DCMTK preparation failed with exit code $LASTEXITCODE" }
            & $baselinePython scripts/prepare_ohif.py --offline
            if ($LASTEXITCODE -ne 0) { throw "Pinned 2.9.1 OHIF preparation failed with exit code $LASTEXITCODE" }
            & $baselinePython scripts/build_windows.py --version 2.9.1
            if ($LASTEXITCODE -ne 0) { throw "Pinned 2.9.1 application build failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $source = (Resolve-Path (Join-Path $baselineRoot "build\windows\dist\DcmGet")).Path
          $icon = (Resolve-Path (Join-Path $baselineRoot "build\windows\dcmget.ico")).Path
          $license = (Resolve-Path (Join-Path $baselineRoot "LICENSE")).Path
          $redist = (Resolve-Path "build/windows/vc_redist.x64.exe").Path
          $language = (Resolve-Path "build/windows/ChineseSimplified.isl").Path
          $fixture = (New-Item -ItemType Directory -Force "build/windows/upgrade-fixture").FullName
          $installerScript = Join-Path $baselineRoot "packaging\windows\dcmget.iss"
          & $iscc "/DAppVersion=2.9.1" "/DSourceDir=$source" "/DReleaseDir=$fixture" "/DBuildIcon=$icon" "/DLicenseFile=$license" "/DVCRedistPath=$redist" "/DChineseLanguageFile=$language" $installerScript
          if ($LASTEXITCODE -ne 0) { throw "Pinned 2.9.1 installer compilation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $fixture "DcmGet-2.9.1-Setup-x64.exe") -PathType Leaf)) { throw "Pinned 2.9.1 installer is missing" }
          Remove-Item (Join-Path $baselineRoot "build") -Recurse -Force
          Remove-Item (Join-Path $baselineRoot "release") -Recurse -Force
          Remove-Item $baselineRuntime -Recurse -Force

      - name: Build current one-click installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $source = (Resolve-Path "build/windows/dist/DcmGet").Path
          $release = (Resolve-Path "release/windows").Path
          $icon = (Resolve-Path "build/windows/dcmget.ico").Path
          $license = (Resolve-Path "LICENSE").Path
          $redist = (Resolve-Path "build/windows/vc_redist.x64.exe").Path
          $language = (Resolve-Path "build/windows/ChineseSimplified.isl").Path
          $webview2 = (Resolve-Path $env:DCMGET_WEBVIEW2_RUNTIME_PATH).Path
          & $iscc "/DAppVersion=${{ inputs.version }}" "/DSourceDir=$source" "/DReleaseDir=$release" "/DBuildIcon=$icon" "/DLicenseFile=$license" "/DVCRedistPath=$redist" "/DChineseLanguageFile=$language" "/DWebView2RuntimePath=$webview2" "packaging/windows/dcmget.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Sign installer before testing exact release artifact
        shell: pwsh
        run: |
          $env:DCMGET_SETUP_PATH = (Resolve-Path "release/windows/DcmGet-${{ inputs.version }}-Setup-x64.exe").Path
          python -c "import os; from pathlib import Path; from scripts.build_windows import sign_windows_payloads; sign_windows_payloads([Path(os.environ['DCMGET_SETUP_PATH'])])"

      - name: Prepare pinned 2.9.1 large-task fixture script
        shell: pwsh
        run: |
          $baselineRoot = (Resolve-Path "upgrade-baseline").Path
          # Keep the script beside the pinned source tree so Python places that
          # checkout on sys.path even though the baseline venv is not installed
          # as a package.
          $fixturePath = Join-Path $baselineRoot ".dcmget-create-291-task.py"
          $fixtureSource = @'
          import json
          import os
          from pathlib import Path

          from dcmget.config import AppConfig
          from dcmget.core import AccessionResult, AccessionStatus
          from dcmget.task_state import TaskCheckpointStore

          config_path = Path(os.environ["DCMGET_UPGRADE_CONFIG_PATH"])
          task_path = Path(os.environ["DCMGET_UPGRADE_TASK_PATH"])
          task_id_path = Path(os.environ["DCMGET_UPGRADE_TASK_ID_PATH"])
          sentinel = Path(os.environ["DCMGET_UPGRADE_SENTINEL_PATH"])
          config = AppConfig.from_dict(json.loads(config_path.read_text(encoding="utf-8")))
          accessions = [f"UPGRADE{index:04d}" for index in range(1, 202)]
          store = TaskCheckpointStore(task_path)
          if not store.try_acquire_lease():
              raise RuntimeError("could not acquire the pinned 2.9.1 task lease")
          try:
              checkpoint = store.start(config, accessions, trial_required=False)
              store.record_result(
                  checkpoint.task_id,
                  AccessionResult(
                      accessions[0],
                      AccessionStatus.COMPLETED,
                      file_count=1,
                      received_bytes=sentinel.stat().st_size,
                      archived_files=[str(sentinel)],
                  ),
              )
              restored = store.load_required(include_archived_files=False)
              if len(restored.accessions) != 201 or len(restored.results) != 1:
                  raise RuntimeError("pinned 2.9.1 large-task fixture did not round-trip")
              task_id_path.write_text(restored.task_id, encoding="ascii")
          finally:
              store.release_lease()
          '@
          [IO.File]::WriteAllText($fixturePath, $fixtureSource, [Text.UTF8Encoding]::new($false))

      - name: Silent install and in-place upgrade test
        shell: pwsh
        run: |
          $baseline = (Resolve-Path "build/windows/upgrade-fixture/DcmGet-2.9.1-Setup-x64.exe").Path
          $setup = (Resolve-Path "release/windows/DcmGet-${{ inputs.version }}-Setup-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "DcmGetInstalled"
          $upgradeDicomDir = Join-Path $env:RUNNER_TEMP "DcmGetUpgradeDicom"
          $downloadSentinelPath = Join-Path $upgradeDicomDir "keep-download.dcm"
          $configDir = Join-Path $env:APPDATA "DcmGet"
          $configPath = Join-Path $configDir "config.json"
          $profile1ConfigPath = Join-Path $configDir "instances\i1\config.json"
          $profile1TaskPath = Join-Path $env:LOCALAPPDATA "DcmGet\instances\i1\active-task.sqlite3"
          $upgradeTaskIdPath = Join-Path $env:RUNNER_TEMP "dcmget-291-upgrade-task-id.txt"
          $licensePath = Join-Path $configDir "license.lic"
          $trialPath = Join-Path $configDir "trial.json"
          $trialAnchorPath = Join-Path $env:ProgramData "DcmGet\.trial-anchor"
          $uninstallRoot = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall"
          $serviceName = "kayisoft-dcmget"

          function Assert-FixedDcmGetPortAvailable([int]$port, [string]$purpose) {
            $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
            if ($listeners.Count -eq 0) { return }
            $owners = @(
              $listeners | ForEach-Object {
                Get-CimInstance Win32_Process -Filter "ProcessId = $($_.OwningProcess)" -ErrorAction SilentlyContinue
              } | Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine
            )
            $owners | Format-List | Out-String | Write-Host
            throw "Fixed DcmGet $purpose port $port is occupied before installer testing"
          }

          Remove-Item $configDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $upgradeDicomDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Split-Path -Parent $profile1TaskPath) -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $upgradeTaskIdPath -Force -ErrorAction SilentlyContinue
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            throw "Legacy service already exists before installer testing"
          }
          Assert-FixedDcmGetPortAvailable 8786 "management"
          Assert-FixedDcmGetPortAvailable 8787 "Profile 1"

          $install = Start-Process $baseline -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Baseline installer failed with exit code $($install.ExitCode)" }
          $baselineRecords = @(Get-ChildItem $uninstallRoot | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -eq "DcmGet" })
          if ($baselineRecords.Count -ne 1) { throw "Expected one 2.9.1 uninstall record, found $($baselineRecords.Count)" }
          if ($baselineRecords[0].DisplayVersion -ne "2.9.1") { throw "Baseline installed version is $($baselineRecords[0].DisplayVersion), expected 2.9.1" }
          if ($baselineRecords[0].InstallLocation.TrimEnd('\') -ne $installDir.TrimEnd('\')) { throw "Baseline installation directory is incorrect" }
          New-Item -ItemType Directory -Force $configDir | Out-Null
          New-Item -ItemType Directory -Force $upgradeDicomDir | Out-Null
          $upgradeWebPort = 8787
          $upgradeConfig = [ordered]@{
            config_version = 6
            pacs_server_ip = "upgrade-preserve.invalid"
            pacs_server_port = 104
            calling_ae_title = "DCMGET"
            pacs_ae_title = "PACS01"
            storage_ae_title = "DCMGET"
            storage_port = 16666
            web_port = $upgradeWebPort
            dicom_destination_folder = $upgradeDicomDir
          }
          [IO.File]::WriteAllText($configPath, ($upgradeConfig | ConvertTo-Json -Compress), [Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Force (Split-Path -Parent $profile1ConfigPath) | Out-Null
          [IO.File]::WriteAllText($profile1ConfigPath, ($upgradeConfig | ConvertTo-Json -Compress), [Text.UTF8Encoding]::new($false))
          $baselineUi = Start-Process "$installDir/DcmGet.exe" -ArgumentList @("--ui-self-test", "--config", "`"$configPath`"") -Wait -PassThru
          if ($baselineUi.ExitCode -ne 0) { throw "Installed 2.9.1 UI self-test failed with code $($baselineUi.ExitCode)" }
          [IO.File]::WriteAllText($downloadSentinelPath, "download-result-sentinel", [Text.UTF8Encoding]::new($false))
          $baselineRoot = (Resolve-Path "upgrade-baseline").Path
          $baselinePython = Join-Path $baselineRoot ".venv\Scripts\python.exe"
          $fixturePath = Join-Path $baselineRoot ".dcmget-create-291-task.py"
          $env:DCMGET_UPGRADE_CONFIG_PATH = $profile1ConfigPath
          $env:DCMGET_UPGRADE_TASK_PATH = $profile1TaskPath
          $env:DCMGET_UPGRADE_TASK_ID_PATH = $upgradeTaskIdPath
          $env:DCMGET_UPGRADE_SENTINEL_PATH = $downloadSentinelPath
          Push-Location $baselineRoot
          try {
            & $baselinePython $fixturePath
            if ($LASTEXITCODE -ne 0) { throw "Could not create pinned 2.9.1 large-task checkpoint: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path $profile1TaskPath -PathType Leaf)) { throw "Pinned 2.9.1 large-task checkpoint is missing" }
          $upgradeTaskId = (Get-Content $upgradeTaskIdPath -Raw).Trim()
          if ($upgradeTaskId -notmatch '^[0-9a-f]{32}$') { throw "Pinned 2.9.1 task id is invalid: $upgradeTaskId" }
          Set-Content $licensePath "upgrade-license-sentinel"
          python -c "from dcmget.licensing import consume_trial; consume_trial()"
          if ($LASTEXITCODE -ne 0) { throw "Could not create valid trial state" }
          Set-Content "$installDir/_internal/obsolete-upgrade-marker.txt" "remove-me"
          $configHash = (Get-FileHash $configPath -Algorithm SHA256).Hash
          $profile1ConfigHash = (Get-FileHash $profile1ConfigPath -Algorithm SHA256).Hash
          $licenseHash = (Get-FileHash $licensePath -Algorithm SHA256).Hash
          $trialHash = (Get-FileHash $trialPath -Algorithm SHA256).Hash
          $trialAnchorHash = (Get-FileHash $trialAnchorPath -Algorithm SHA256).Hash

          # Seed the exact legacy service identity and files so the current
          # installer proves that an upgrade removes the retired WinSW service.
          $legacyServiceFiles = @(
            (Join-Path $installDir "kayisoft-dcmget.exe"),
            (Join-Path $installDir "kayisoft-dcmget.xml"),
            (Join-Path $installDir "kayisoft-dcmget.xml.template"),
            (Join-Path $installDir "kayisoft-dcmget-host.ps1"),
            (Join-Path $installDir "LICENSE-WINSW.txt")
          )
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $legacyServiceFiles[0] -Force
          $legacyServiceFiles[1..4] | ForEach-Object { Set-Content -LiteralPath $_ "legacy-service-sentinel" }
          New-Item "HKLM:\Software\DcmGet\WindowsService" -Force | Out-Null
          New-ItemProperty "HKLM:\Software\DcmGet\WindowsService" -Name AppDataRoot -Value $env:APPDATA -PropertyType String -Force | Out-Null
          New-Service -Name $serviceName -BinaryPathName $legacyServiceFiles[0] -StartupType Manual | Out-Null
          if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
            throw "Could not create the legacy service upgrade fixture"
          }

          # Replace the three inactive helper executables with a deterministic long-running
          # fixture.  The upgrade must end these processes and their ping children,
          # while preserving the same-named process outside the installation root.
          $managedExecutablePaths = @(
            (Join-Path $installDir "_internal\DcmGetPdiServer.exe"),
            (Join-Path $installDir "_internal\.runtime\dcmtk\windows-x86_64\dcmtk-3.7.0-win64-dynamic\bin\storescp.exe"),
            (Join-Path $installDir "_internal\.runtime\dcmtk\windows-x86_64\dcmtk-3.7.0-win64-dynamic\bin\movescu.exe")
          )
          foreach ($managedPath in $managedExecutablePaths) {
            if (-not (Test-Path $managedPath -PathType Leaf)) { throw "Upgrade process fixture is missing: $managedPath" }
            Copy-Item "$env:SystemRoot\System32\cmd.exe" $managedPath -Force
          }
          $managedProcesses = @(
            $managedExecutablePaths | ForEach-Object {
              Start-Process $_ -ArgumentList @("/d", "/c", "ping.exe -t 127.0.0.1 >NUL") -PassThru
            }
          )
          $outsideRoot = Join-Path $env:RUNNER_TEMP "DcmGetOutsideProcess"
          New-Item -ItemType Directory -Force $outsideRoot | Out-Null
          $outsideTool = Join-Path $outsideRoot "storescp.exe"
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $outsideTool -Force
          $outsideProcess = Start-Process $outsideTool -ArgumentList @("/d", "/c", "ping.exe -t 127.0.0.1 >NUL") -PassThru
          Start-Sleep -Seconds 1
          $managedChildIds = @()
          foreach ($managedProcess in $managedProcesses) {
            $managedProcess.Refresh()
            if ($managedProcess.HasExited) { throw "Managed process fixture exited before upgrade: $($managedProcess.Id)" }
            $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($managedProcess.Id)")
            if ($children.Count -lt 1) { throw "Managed process fixture has no child: $($managedProcess.Id)" }
            $managedChildIds += @($children | ForEach-Object ProcessId)
          }
          $outsideProcess.Refresh()
          if ($outsideProcess.HasExited) { throw "Outside process fixture exited before upgrade" }

          $upgrade = Start-Process $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=desktopicon") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade installer failed with exit code $($upgrade.ExitCode)" }
          $webview2ClientKey = "SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $webview2Versions = @(
            Get-ItemProperty "HKLM:\$webview2ClientKey" -Name pv -ErrorAction SilentlyContinue
            Get-ItemProperty "HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -Name pv -ErrorAction SilentlyContinue
          ) | ForEach-Object { [string]$_.pv } | Where-Object { $_ -and $_ -ne "0.0.0.0" }
          if ($webview2Versions.Count -lt 1) { throw "Upgrade did not install the bundled WebView2 Runtime" }
          if (-not ($webview2Versions | Where-Object { [int]($_.Split('.')[0]) -ge 111 })) {
            throw "Installed WebView2 Runtime is older than Edge 111: $($webview2Versions -join ', ')"
          }
          foreach ($managedProcess in $managedProcesses) {
            $managedProcess.Refresh()
            if (-not $managedProcess.HasExited) { throw "Installer did not stop managed process $($managedProcess.Id)" }
          }
          foreach ($childId in $managedChildIds) {
            if (Get-Process -Id $childId -ErrorAction SilentlyContinue) { throw "Installer left a managed child process running: $childId" }
          }
          $outsideProcess.Refresh()
          if ($outsideProcess.HasExited) { throw "Installer killed same-named process outside install directory" }
          taskkill /PID $outsideProcess.Id /T /F | Out-Null
          Remove-Item $outsideRoot -Recurse -Force
          if (-not (Test-Path "$installDir/DcmGet.exe")) { throw "Installed DcmGet.exe is missing" }
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            throw "Upgrade left the legacy kayisoft-dcmget service behind"
          }
          if (Test-Path "HKLM:\Software\DcmGet\WindowsService") {
            throw "Upgrade left legacy Windows service state behind"
          }
          $legacyServiceFiles | ForEach-Object {
            if (Test-Path -LiteralPath $_) { throw "Upgrade left a legacy service resource behind: $_" }
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\DcmGet\logs")) { throw "Diagnostic log directory is missing" }
          $diagnosticShortcuts = @(
            (Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\DcmGet 诊断日志.lnk"),
            (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\DcmGet 诊断日志.lnk")
          )
          if (-not ($diagnosticShortcuts | Where-Object { Test-Path $_ })) { throw "Diagnostic log shortcut is missing" }
          $installedDcmtkBin = (Resolve-Path "$installDir/_internal/.runtime/dcmtk/windows-x86_64/dcmtk-3.7.0-win64-dynamic/bin").Path
          $expectedDcmtkBin = @(
            "movescu.exe", "storescp.exe", "dcmmkdir.exe", "dcmdump.exe",
            "dcmdata.dll", "dcmimage.dll", "dcmimgle.dll", "dcmjpeg.dll",
            "dcmnet.dll", "dcmtls.dll", "ijg8.dll", "ijg12.dll", "ijg16.dll",
            "oficonv.dll", "oflog.dll", "ofstd.dll"
          ) | Sort-Object
          $installedDcmtkFiles = @(Get-ChildItem $installedDcmtkBin -File | ForEach-Object Name | Sort-Object)
          $installedDcmtkDifference = @(Compare-Object $expectedDcmtkBin $installedDcmtkFiles)
          if ($installedDcmtkDifference.Count -ne 0) {
            throw "Installed DCMTK bin allowlist mismatch: $($installedDcmtkDifference | Out-String)"
          }
          $resourceRoot = Join-Path $installDir "_internal"
          $webui = Join-Path $resourceRoot "dcmget\webui-react"
          @("index.html", "app.css", "app.js", "theme.js") | ForEach-Object {
            if (-not (Test-Path (Join-Path $webui $_) -PathType Leaf)) { throw "Installed DcmGet React Web resource is missing: $_" }
          }
          $ohif = Join-Path $resourceRoot ".runtime\ohif\ohif-3.12.6"
          if (-not (Test-Path (Join-Path $resourceRoot "DcmGetPdiServer.exe") -PathType Leaf)) { throw "Installed PDI local server is missing" }
          if (-not (Test-Path (Join-Path $resourceRoot "dcmget\pdi_server.py") -PathType Leaf)) { throw "Installed portable PDI server script is missing" }
          if (-not (Test-Path (Join-Path $resourceRoot "dcmget\architecture.py") -PathType Leaf)) { throw "Installed PDI architecture guard is missing" }
          @("index.html", "app-config.js", "init-service-worker.js", "LICENSE-OHIF.txt", "THIRD_PARTY-OHIF.md", "DCMGET_OHIF_PAYLOAD.json", "DCMGET_PAYLOAD.SHA256") | ForEach-Object {
            if (-not (Test-Path (Join-Path $ohif $_) -PathType Leaf)) { throw "Installed OHIF resource is missing: $_" }
          }
          if (Test-Path "$installDir/_internal/obsolete-upgrade-marker.txt") { throw "Upgrade did not remove obsolete runtime files" }
          if ((Get-FileHash $configPath -Algorithm SHA256).Hash -ne $configHash) { throw "Upgrade changed the existing user configuration" }
          if ((Get-FileHash $profile1ConfigPath -Algorithm SHA256).Hash -ne $profile1ConfigHash) { throw "Upgrade changed the existing 2.9.1 Profile 1 configuration" }
          if ((Get-FileHash $licensePath -Algorithm SHA256).Hash -ne $licenseHash) { throw "Upgrade changed the existing license" }
          if ((Get-FileHash $trialPath -Algorithm SHA256).Hash -ne $trialHash) { throw "Upgrade changed the existing trial state" }
          if ((Get-FileHash $trialAnchorPath -Algorithm SHA256).Hash -ne $trialAnchorHash) { throw "Upgrade changed the machine trial anchor" }

          $records = @(Get-ChildItem $uninstallRoot | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -eq "DcmGet" })
          if ($records.Count -ne 1) { throw "Expected one DcmGet uninstall record, found $($records.Count)" }
          if ($records[0].DisplayVersion -ne "${{ inputs.version }}") { throw "Installed version is $($records[0].DisplayVersion)" }
          if ($records[0].InstallLocation.TrimEnd('\') -ne $installDir.TrimEnd('\')) { throw "Upgrade changed the installation directory" }

          $startMenuRoots = @(
            (Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs"),
            (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs")
          )
          $desktopRoots = @(
            (Join-Path $env:PUBLIC "Desktop"),
            (Join-Path $env:USERPROFILE "Desktop")
          )
          $startMenuShortcut = $startMenuRoots | ForEach-Object { Join-Path $_ "DcmGet.lnk" } | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          $desktopShortcut = $desktopRoots | ForEach-Object { Join-Path $_ "DcmGet.lnk" } | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $startMenuShortcut) { throw "Installed DcmGet Start Menu shortcut is missing" }
          if (-not $desktopShortcut) { throw "Installed DcmGet desktop shortcut is missing" }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($shortcut in @($startMenuShortcut, $desktopShortcut)) {
            $link = $shell.CreateShortcut($shortcut)
            if (-not [string]::Equals($link.TargetPath, (Join-Path $installDir "DcmGet.exe"), [StringComparison]::OrdinalIgnoreCase)) {
              throw "Installed DcmGet shortcut target is incorrect: $shortcut"
            }
            if ($link.Arguments -ne "--windows-desktop") {
              throw "Installed DcmGet shortcut does not launch the desktop manager: $shortcut"
            }
          }
          foreach ($legacyShortcut in @("DcmGet 启动后台服务.lnk", "DcmGet 停止后台服务.lnk")) {
            if ($startMenuRoots | Where-Object { Test-Path (Join-Path $_ $legacyShortcut) -PathType Leaf }) {
              throw "Upgrade left a legacy service shortcut behind: $legacyShortcut"
            }
          }

          function Assert-DcmGetFirewallRule([string]$displayName, [string]$expectedProgram) {
            $rules = @(Get-NetFirewallRule -DisplayName $displayName -ErrorAction Stop)
            if ($rules.Count -ne 1) { throw "Expected exactly one '$displayName' firewall rule, found $($rules.Count)" }
            $rule = $rules[0]
            if ($rule.Direction.ToString() -ne "Inbound" -or $rule.Action.ToString() -ne "Allow" -or $rule.Enabled.ToString() -ne "True" -or $rule.EdgeTraversalPolicy.ToString() -ne "Block") {
              throw "Firewall rule '$displayName' must be enabled inbound allow with edge traversal blocked"
            }
            $portFilters = @($rule | Get-NetFirewallPortFilter)
            if ($portFilters.Count -ne 1 -or $portFilters[0].Protocol -ne "TCP" -or $portFilters[0].LocalPort.ToString() -ne "Any") {
              throw "Firewall rule '$displayName' must allow the configured TCP port"
            }
            $applicationFilters = @($rule | Get-NetFirewallApplicationFilter)
            if ($applicationFilters.Count -ne 1) { throw "Expected one '$displayName' firewall application filter, found $($applicationFilters.Count)" }
            $configuredProgram = [Environment]::ExpandEnvironmentVariables($applicationFilters[0].Program.Trim('"'))
            $actualProgram = (Resolve-Path -LiteralPath $configuredProgram -ErrorAction Stop).ProviderPath
            if (-not $actualProgram.Equals($expectedProgram, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Firewall program for '$displayName' is '$actualProgram', expected '$expectedProgram'"
            }
            $profileNames = @($rule.Profile.ToString().Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            if ($profileNames.Count -ne 2 -or $profileNames -notcontains "Domain" -or $profileNames -notcontains "Private") {
              throw "Firewall profiles for '$displayName' must be exactly Domain and Private, found '$($rule.Profile)'"
            }
          }

          if (Get-NetFirewallRule -DisplayName "DcmGet storescp TCP" -ErrorAction SilentlyContinue) { throw "Upgrade left the legacy storescp program rule behind" }
          if (Get-NetFirewallRule -DisplayName "DcmGet storescp TCP 6666" -ErrorAction SilentlyContinue) { throw "Upgrade left the legacy TCP 6666 firewall rule behind" }
          $expectedReceiver = (Resolve-Path -LiteralPath (Join-Path $installDir "_internal\.runtime\dcmtk\windows-x86_64\dcmtk-3.7.0-win64-dynamic\bin\storescp.exe") -ErrorAction Stop).ProviderPath
          $expectedWeb = (Resolve-Path -LiteralPath (Join-Path $installDir "DcmGet.exe") -ErrorAction Stop).ProviderPath
          Assert-DcmGetFirewallRule "DcmGet Receiver TCP" $expectedReceiver
          Assert-DcmGetFirewallRule "DcmGet Web TCP" $expectedWeb

          $existingWebView2Ids = @(
            Get-Process -Name "msedgewebview2" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Id }
          )
          $desktopManager = Start-Process "$installDir/DcmGet.exe" -ArgumentList "--windows-desktop" -PassThru
          $desktopManagerReady = $false
          $nativeWebViewStarted = $false
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            $desktopManager.Refresh()
            if ($desktopManager.HasExited) {
              throw "Installed desktop manager exited early with code $($desktopManager.ExitCode)"
            }
            try {
              $bootstrap = Invoke-RestMethod "http://127.0.0.1:8786/api/bootstrap" -TimeoutSec 2
              if ($null -ne $bootstrap) { $desktopManagerReady = $true }
            } catch {}
            $newWebView2 = @(
              Get-Process -Name "msedgewebview2" -ErrorAction SilentlyContinue |
                Where-Object { $_.Id -notin $existingWebView2Ids }
            )
            if ($newWebView2.Count -gt 0) { $nativeWebViewStarted = $true }
            if ($desktopManagerReady -and $nativeWebViewStarted) { break }
            Start-Sleep -Milliseconds 250
          }
          if (-not $desktopManagerReady) { throw "Installed desktop manager did not expose the management API" }
          if (-not $nativeWebViewStarted) { throw "Installed desktop manager did not start a WebView2 process" }
          Set-Content (Join-Path $env:RUNNER_TEMP "dcmget-desktop-manager.pid") $desktopManager.Id

      - name: Verify upgraded 2.9.1 large-task recovery contract
        shell: pwsh
        run: |
          $profile1TaskPath = Join-Path $env:LOCALAPPDATA "DcmGet\instances\i1\active-task.sqlite3"
          $upgradeTaskId = (Get-Content (Join-Path $env:RUNNER_TEMP "dcmget-291-upgrade-task-id.txt") -Raw).Trim()
          $downloadSentinelPath = Join-Path (Join-Path $env:RUNNER_TEMP "DcmGetUpgradeDicom") "keep-download.dcm"
          $managementUrl = "http://127.0.0.1:8786"
          $profileUrl = "http://127.0.0.1:8787"
          $managementSession = [Microsoft.PowerShell.Commands.WebRequestSession]::new()
          $managementBootstrap = Invoke-RestMethod "$managementUrl/api/bootstrap" -WebSession $managementSession -TimeoutSec 10
          $managementHeaders = @{
            Origin = $managementUrl
            "X-CSRF-Token" = [string]$managementBootstrap.csrf_token
          }
          Invoke-RestMethod "$managementUrl/api/management/profiles/1/start" `
            -Method Post `
            -WebSession $managementSession `
            -Headers $managementHeaders `
            -ContentType "application/json" `
            -Body "{}" `
            -TimeoutSec 20 | Out-Null
          $profileSession = [Microsoft.PowerShell.Commands.WebRequestSession]::new()
          $bootstrap = $null
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            try {
              $bootstrap = Invoke-RestMethod "$profileUrl/api/bootstrap" -WebSession $profileSession -TimeoutSec 5
              break
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          if ($null -eq $bootstrap) { throw "Upgraded Profile 1 did not expose its bootstrap API" }
          if ([string]$bootstrap.task.id -ne $upgradeTaskId) { throw "Upgrade did not restore the pinned 2.9.1 task id" }
          if ([int]$bootstrap.task.total -ne 201) { throw "Upgraded large task total is $($bootstrap.task.total), expected 201" }
          if ($bootstrap.task.large_batch -ne $true) { throw "Upgraded 2.9.1 task is not marked as a large batch" }
          if ($bootstrap.task.PSObject.Properties.Name -notcontains "accessions" -or $null -ne $bootstrap.task.accessions) {
            throw "Large-task bootstrap must explicitly return null accessions"
          }
          if ($bootstrap.task.PSObject.Properties.Name -notcontains "results" -or $null -ne $bootstrap.task.results) {
            throw "Large-task bootstrap must explicitly return null results"
          }
          if ([int]$bootstrap.task.processed -lt 1) { throw "Upgrade lost the completed 2.9.1 task row" }
          $taskEndpoint = Invoke-RestMethod "$profileUrl/api/task" -WebSession $profileSession -TimeoutSec 20
          if ([string]$taskEndpoint.task.id -ne $upgradeTaskId) { throw "Profile task endpoint is unavailable after the 2.9.1 upgrade" }

          $csrfHeaders = @{ Origin = $profileUrl; "X-CSRF-Token" = [string]$bootstrap.csrf_token }
          Invoke-RestMethod "$profileUrl/api/task/end" -Method Post -WebSession $profileSession -Headers $csrfHeaders -ContentType "application/json" -Body "{}" -TimeoutSec 20 | Out-Null
          $largeTaskCleared = $false
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            $currentTask = Invoke-RestMethod "$profileUrl/api/task" -WebSession $profileSession -TimeoutSec 20
            if ($currentTask.task.actions.can_start -eq $true -and -not (Test-Path $profile1TaskPath)) {
              $largeTaskCleared = $true
              break
            }
            Start-Sleep -Milliseconds 250
          }
          if (-not $largeTaskCleared) { throw "Upgraded 2.9.1 large task could not be ended cleanly" }
          if (-not (Test-Path $downloadSentinelPath -PathType Leaf)) { throw "Ending the upgraded task deleted an existing DICOM result" }

      - name: Windows desktop lifecycle and uninstall test
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "DcmGetInstalled"
          $configDir = Join-Path $env:APPDATA "DcmGet"
          $configPath = Join-Path $configDir "config.json"
          $profile1ConfigPath = Join-Path $configDir "instances\i1\config.json"
          $licensePath = Join-Path $configDir "license.lic"
          $trialPath = Join-Path $configDir "trial.json"
          $trialAnchorPath = Join-Path $env:ProgramData "DcmGet\.trial-anchor"
          $upgradeDicomDir = Join-Path $env:RUNNER_TEMP "DcmGetUpgradeDicom"
          $downloadSentinelPath = Join-Path $upgradeDicomDir "keep-download.dcm"
          $preservedFiles = @(
            $configPath,
            $profile1ConfigPath,
            $licensePath,
            $trialPath,
            $trialAnchorPath,
            $downloadSentinelPath
          )
          $preservedHashes = @{}
          foreach ($path in $preservedFiles) {
            $preservedHashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }

          $desktopManagerId = [int](Get-Content (Join-Path $env:RUNNER_TEMP "dcmget-desktop-manager.pid") -Raw)
          $desktopManager = Get-CimInstance Win32_Process -Filter "ProcessId = $desktopManagerId" -ErrorAction SilentlyContinue
          if ($null -eq $desktopManager -or ([string]$desktopManager.CommandLine) -notmatch "(?:^|\s)--windows-desktop(?:\s|$)") {
            throw "Installed desktop manager is not running before uninstall"
          }
          $profileProcesses = @(
            Get-CimInstance Win32_Process -Filter "Name = 'DcmGet.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                ([string]$_.ExecutablePath).Equals((Join-Path $installDir "DcmGet.exe"), [StringComparison]::OrdinalIgnoreCase) -and
                ([string]$_.CommandLine) -match "(?:^|\s)--profile\s+1(?:\s|$)"
              }
          )
          if ($profileProcesses.Count -ne 1) { throw "Profile 1 is not running under the desktop manager before uninstall" }
          $installedProcessIds = @(
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object {
                ([string]$_.ExecutablePath).StartsWith($installDir + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)
              } |
              ForEach-Object ProcessId
          )

          $uninstallLog = Join-Path $env:RUNNER_TEMP "dcmget-uninstall.log"
          Remove-Item $uninstallLog -Force -ErrorAction SilentlyContinue
          $uninstall = Start-Process "$installDir/unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            if (Test-Path $uninstallLog -PathType Leaf) { Get-Content $uninstallLog | Write-Host }
            throw "Uninstaller failed with exit code $($uninstall.ExitCode)"
          }
          for ($attempt = 0; $attempt -lt 120 -and (Test-Path $installDir); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installDir) {
            Get-ChildItem $installDir -Force -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize | Out-String | Write-Host
            throw "Installation directory remains after uninstall"
          }
          foreach ($processId in $installedProcessIds) {
            if (Get-Process -Id $processId -ErrorAction SilentlyContinue) {
              throw "Uninstall left an installed DcmGet process running: $processId"
            }
          }
          if (Get-Service -Name "kayisoft-dcmget" -ErrorAction SilentlyContinue) { throw "Uninstall left the legacy service behind" }
          if (Test-Path "HKLM:\Software\DcmGet\WindowsService") { throw "Uninstall left legacy service state behind" }
          foreach ($path in $preservedFiles) {
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $preservedHashes[$path]) {
              throw "Uninstall removed or changed preserved data: $path"
            }
          }
          foreach ($firewallRule in @("DcmGet Receiver TCP", "DcmGet Web TCP", "DcmGet storescp TCP", "DcmGet storescp TCP 6666")) {
            if (Get-NetFirewallRule -DisplayName $firewallRule -ErrorAction SilentlyContinue) {
              throw "Uninstall left a firewall rule behind: $firewallRule"
            }
          }
          Remove-Item $configDir -Recurse -Force
          Remove-Item $upgradeDicomDir -Recurse -Force

      - name: Enforce Windows x64 gate, verify signatures, and finalize manifest
        shell: pwsh
        run: |
          python scripts/windows_release_gate.py `
            --release-dir release/windows `
            --version "${{ inputs.version }}" `
            --amd64-pe build/windows/dist/DcmGet/DcmGet.exe `
            --amd64-pe build/windows/dist/DcmGetPdiServer.exe `
            --amd64-pe "release/windows/DcmGet-${{ inputs.version }}-windows-x64-portable.exe" `
            --dcmtk-bin "build/windows/dcmtk-runtime/dcmtk-3.7.0-win64-dynamic/bin" `
            --verify-existing-signatures

      - name: Download previous stable release for component diff
        if: ${{ inputs.publish_release && inputs.component_update }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest"
          if ($LASTEXITCODE -ne 0) {
            throw "component_update requires a previous stable GitHub Release"
          }
          $release = $releaseJson | ConvertFrom-Json
          $releaseTag = [string]$release.tag_name
          $tagPattern = '^(?:component-)?v(?<version>\d+\.\d+\.\d+)$'
          if ($releaseTag -notmatch $tagPattern) {
            throw "Previous release tag is not vX.Y.Z or component-vX.Y.Z: $releaseTag"
          }
          $tagVersion = [string]$Matches["version"]
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          foreach ($required in @("UPDATE-MANIFEST.json", "UPDATE-MANIFEST.signed.json")) {
            if ($assetNames -notcontains $required) {
              throw "Previous stable release does not support component updates: missing $required"
            }
          }
          $snapshotName = "component-baseline.zip"
          $fullArchiveName = "DcmGet-$tagVersion-windows-x64.zip"
          if ($assetNames -contains $snapshotName) {
            $archiveName = $snapshotName
            $usesFullRelease = $false
          } elseif ($assetNames -contains $fullArchiveName) {
            $archiveName = $fullArchiveName
            $usesFullRelease = $true
          } else {
            throw "Previous stable release has neither $snapshotName nor $fullArchiveName"
          }
          $baseline = Join-Path $env:RUNNER_TEMP "dcmget-update-baseline"
          Remove-Item $baseline -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $baseline | Out-Null
          gh release download $release.tag_name `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $archiveName `
            --pattern "UPDATE-MANIFEST.json" `
            --pattern "UPDATE-MANIFEST.signed.json" `
            --dir $baseline
          if ($LASTEXITCODE -ne 0) { throw "Could not download previous stable update assets" }

          $manifestPath = Join-Path $baseline "UPDATE-MANIFEST.json"
          $signaturePath = Join-Path $baseline "UPDATE-MANIFEST.signed.json"
          $rawManifest = [IO.File]::ReadAllBytes($manifestPath)
          python -c "import sys; from pathlib import Path; from dcmget.update_signing import verify_manifest; from dcmget.update_trust import TRUSTED_UPDATE_PUBLIC_KEYS; assert verify_manifest(Path(sys.argv[1]).read_bytes(), TRUSTED_UPDATE_PUBLIC_KEYS) == Path(sys.argv[2]).read_bytes()" $signaturePath $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Previous signed manifest content mismatch"
          }
          try {
            $utf8 = [Text.UTF8Encoding]::new($false, $true)
            $manifest = $utf8.GetString($rawManifest) | ConvertFrom-Json
          } catch {
            throw "Previous signed manifest is not valid UTF-8 JSON: $_"
          }
          if (
            [string]$manifest.product -ne "DcmGet" -or
            [string]$manifest.platform -ne "windows-x64" -or
            [string]$manifest.channel -ne "stable"
          ) {
            throw "Previous signed manifest identity is invalid"
          }
          $baseVersion = [string]$manifest.version
          if ($baseVersion -ne $tagVersion) {
            throw "Previous release tag and signed manifest version mismatch: $tagVersion / $baseVersion"
          }
          if ([Version]$baseVersion -ge [Version]$env:TARGET_VERSION) {
            throw "Previous signed baseline version must be lower than target version: $baseVersion / $env:TARGET_VERSION"
          }

          $expanded = Join-Path $baseline "expanded"
          Expand-Archive (Join-Path $baseline $archiveName) $expanded
          $installRoot = if ($usesFullRelease) {
            Join-Path $expanded "DcmGet"
          } else {
            $expanded
          }
          if (-not (Test-Path (Join-Path $installRoot "DcmGet.exe") -PathType Leaf)) {
            throw "Previous stable baseline does not contain DcmGet.exe"
          }
          "DCMGET_UPDATE_BASE_VERSION=$baseVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DCMGET_UPDATE_BASE_ROOT=$installRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DCMGET_UPDATE_BASE_MANIFEST=$manifestPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DCMGET_UPDATE_BASE_SIGNATURE=$signaturePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build authenticated Windows update feed
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          DCMGET_ENABLE_COMPONENT_PATCH: ${{ inputs.component_update }}
          DCMGET_UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.DCMGET_UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          $arguments = @(
            "scripts/build_windows_update.py",
            "--release-dir", "release/windows",
            "--version", "${{ inputs.version }}",
            "--install-root", "build/windows/dist/DcmGet",
            "--release-manifest", "release/windows/RELEASE-MANIFEST.json",
            "--full-installer", "release/windows/DcmGet-${{ inputs.version }}-Setup-x64.exe",
            "--compatibility-root", ".",
            "--compatibility-file", "packaging/windows/dcmget.iss",
            "--compatibility-file", "requirements.txt",
            "--compatibility-file", "requirements-build.txt",
            "--compatibility-file", "scripts/build_windows.py",
            "--compatibility-file", "scripts/build_windows_update.py",
            "--compatibility-file", "scripts/download_dcmtk.py",
            "--compatibility-file", "scripts/prepare_ohif.py"
          )
          if ($env:DCMGET_ENABLE_COMPONENT_PATCH -eq "true") {
            $arguments += @(
              "--enable-component-patch",
              "--baseline-install-root", $env:DCMGET_UPDATE_BASE_ROOT,
              "--base-version", $env:DCMGET_UPDATE_BASE_VERSION,
              "--base-update-manifest", $env:DCMGET_UPDATE_BASE_MANIFEST,
              "--base-update-signature", $env:DCMGET_UPDATE_BASE_SIGNATURE
            )
          }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Windows update feed build failed" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DcmGet-${{ inputs.version }}-Setup-x64
          path: |
            release/windows/DcmGet-${{ inputs.version }}-Setup-x64.exe
            release/windows/SHA256SUMS.txt
            release/windows/RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Windows portable application
        uses: actions/upload-artifact@v4
        with:
          name: DcmGet-${{ inputs.version }}-Portable-x64
          path: |
            release/windows/DcmGet-${{ inputs.version }}-windows-x64-portable.exe
            release/windows/SHA256SUMS.txt
            release/windows/RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Windows standalone archive
        uses: actions/upload-artifact@v4
        with:
          name: DcmGet-${{ inputs.version }}-Windows-x64-ZIP
          path: |
            release/windows/DcmGet-${{ inputs.version }}-windows-x64.zip
            release/windows/SHA256SUMS.txt
            release/windows/RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Stage signed GitHub Release payload
        if: ${{ inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: DcmGet-${{ inputs.version }}-GitHub-Release
          path: |
            release/windows/DcmGet-${{ inputs.version }}-Setup-x64.exe
            release/windows/DcmGet-${{ inputs.version }}-windows-x64-portable.exe
            release/windows/DcmGet-${{ inputs.version }}-windows-x64.zip
            release/windows/DcmGet-${{ inputs.version }}-windows-x64-components-from-*.zip
            release/windows/SHA256SUMS.txt
            release/windows/RELEASE-MANIFEST.json
            release/windows/UPDATE-MANIFEST.json
            release/windows/UPDATE-MANIFEST.signed.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish Windows x64 Release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install manifest verification dependency
        run: python -m pip install "cryptography>=44,<47"

      - name: Download verified release payload
        uses: actions/download-artifact@v4
        with:
          name: DcmGet-${{ inputs.version }}-GitHub-Release
          path: release

      - name: Recheck signed x64 release metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import hashlib
          import os
          import re
          import zipfile
          from pathlib import Path
          from pathlib import PurePosixPath

          from dcmget.update_signing import verify_manifest
          from dcmget.update_trust import TRUSTED_UPDATE_PUBLIC_KEYS

          root = Path("release")
          release = json.loads((root / "RELEASE-MANIFEST.json").read_text(encoding="utf-8"))
          raw_update = (root / "UPDATE-MANIFEST.json").read_bytes()
          envelope_path = root / "UPDATE-MANIFEST.signed.json"
          if verify_manifest(envelope_path.read_bytes(), TRUSTED_UPDATE_PUBLIC_KEYS) != raw_update:
              raise SystemExit("UPDATE-MANIFEST.json does not match the Ed25519 signed content")
          update = json.loads(raw_update.decode("utf-8"))
          expected = os.environ["EXPECTED_VERSION"]
          if release.get("product") != "DcmGet" or release.get("platform") != "windows-x64":
              raise SystemExit("release manifest is not DcmGet windows-x64")
          if release.get("version") != expected or update.get("version") != expected:
              raise SystemExit("release version does not match workflow input")
          signing = release.get("signing", {})
          if signing.get("status") not in {"SIGNED", "UNSIGNED"}:
              raise SystemExit("release signing status is invalid")
          if signing.get("status") == "SIGNED" and signing.get("timestamped") is not True:
              raise SystemExit("signed release has no timestamp")
          artifacts = update.get("artifacts")
          if not isinstance(artifacts, list) or not any(
              item.get("kind") == "full_installer" and item.get("signature_status") in {"SIGNED", "UNSIGNED"}
              for item in artifacts if isinstance(item, dict)
          ):
              raise SystemExit("update manifest has no full installer")
          install_tree = str(update.get("install_tree_sha256", "")).lower()
          if re.fullmatch(r"[0-9a-f]{64}", install_tree) is None:
              raise SystemExit("update manifest has no valid install tree SHA-256")
          archive_path = root / f"DcmGet-{expected}-windows-x64.zip"
          tree_records = {}
          with zipfile.ZipFile(archive_path) as archive:
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  pure = PurePosixPath(info.filename.replace("\\", "/"))
                  if pure.is_absolute() or ".." in pure.parts or not pure.parts:
                      raise SystemExit(f"standalone archive path is unsafe: {info.filename}")
                  if pure.parts[0] != "DcmGet" or len(pure.parts) < 2:
                      raise SystemExit(f"standalone archive path is outside DcmGet: {info.filename}")
                  relative = PurePosixPath(*pure.parts[1:]).as_posix()
                  if relative != "DcmGet.exe" and not relative.startswith("_internal/"):
                      raise SystemExit(f"standalone archive path is outside update scope: {relative}")
                  if relative.casefold() in tree_records:
                      raise SystemExit(f"standalone archive path is duplicated: {relative}")
                  digest = hashlib.sha256()
                  with archive.open(info) as source:
                      for block in iter(lambda: source.read(1024 * 1024), b""):
                          digest.update(block)
                  tree_records[relative.casefold()] = (relative, info.file_size, digest.hexdigest())
          if "dcmget.exe" not in tree_records:
              raise SystemExit("standalone archive has no DcmGet.exe")
          tree_digest = hashlib.sha256()
          for relative, size, digest in sorted(tree_records.values()):
              tree_digest.update(relative.encode("utf-8"))
              tree_digest.update(b"\0")
              tree_digest.update(str(size).encode("ascii"))
              tree_digest.update(b"\0")
              tree_digest.update(digest.encode("ascii"))
              tree_digest.update(b"\n")
          if tree_digest.hexdigest() != install_tree:
              raise SystemExit("standalone archive tree does not match signed update manifest")
          for item in artifacts:
              if not isinstance(item, dict) or item.get("kind") != "component_patch":
                  continue
              base_tree = str(item.get("base_tree_sha256", "")).lower()
              target_tree = str(item.get("target_tree_sha256", "")).lower()
              if re.fullmatch(r"[0-9a-f]{64}", base_tree) is None:
                  raise SystemExit("component patch has no valid base tree SHA-256")
              if target_tree != install_tree:
                  raise SystemExit("component patch target tree does not match release tree")
          if not envelope_path.is_file():
              raise SystemExit("authenticated update manifest is missing")
          PY
        env:
          EXPECTED_VERSION: ${{ inputs.version }}

      - name: Publish immutable stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ inputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace published update assets." >&2
            exit 1
          fi
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DcmGet ${{ inputs.version }}" \
            --generate-notes \
            --latest
